services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newsmind
      POSTGRES_USER: newsmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsmind"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://newsmind:${POSTGRES_PASSWORD}@db:5432/newsmind
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://newsmind:${POSTGRES_PASSWORD}@db:5432/newsmind
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-c", "sleep 10 && python -m app.workers.run loop"]
volumes:
  pgdata:
